<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" id="metaAppTitle" content="矩阵云领料台">
<title>📱 矩阵手机 · 专属无损领料台</title>
<style>
  :root {
    --bg: #0b1120; --card: #151f32; --border: #263554;
    --text: #f8fafc; --muted: #94a3b8;
    --green: #10b981; --blue: #3b82f6; --amber: #f59e0b; --pink: #fe2c55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 14px 70px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 15px; margin-bottom: 14px;
  }
  .hdr-title { font-size: 17px; font-weight: 800; }
  .hdr-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .badge-acct {
    background: #fe2c55; color: #fff; font-weight: 800;
    padding: 6px 12px; border-radius: 999px; font-size: 13.5px;
  }
  .btn-refresh {
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }
  .card.is-done { opacity: 0.72; border-color: #065f46; }
  .prod-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .prod-name { font-size: 17px; font-weight: 800; line-height: 1.35; }
  .btn-del {
    background: transparent; border: 1px solid #334155; color: var(--muted);
    border-radius: 8px; padding: 4px 8px; font-size: 11.5px; flex-shrink: 0; cursor: pointer;
  }
  .prod-meta {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted);
  }
  .tag { background: rgba(59,130,246,0.16); color: #93c5fd; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
  .tag-green { background: rgba(16,185,129,0.18); color: #6ee7b7; }
  .step-label {
    font-size: 12px; font-weight: 700; color: #cbd5e1;
    margin: 14px 0 7px; display: flex; align-items: center; gap: 6px;
  }
  .btn {
    width: 100%; border: none; border-radius: 14px;
    padding: 15px 16px; font-size: 16px; font-weight: 800;
    color: #fff; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    text-decoration: none; margin-bottom: 10px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, #fe2c55, #e11d48); box-shadow: 0 4px 16px rgba(254,44,85,0.35); }
  .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
  .btn-slate { background: #283548; border: 1px solid #3b4d6b; font-size: 15px; padding: 13px; }
  .btn-amber { background: linear-gradient(135deg, #d97706, #b45309); font-size: 14px; padding: 12px; }
  .btn-green { background: linear-gradient(135deg, #059669, #047857); }
  .btn[disabled] { opacity: 0.55; cursor: wait; }
  .preload-bar {
    background: #0f172a; border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: #a7f3d0; margin-bottom: 9px;
  }
  .copy-box {
    background: #0f172a; border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 9px;
  }
  .copy-hdr { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .copy-txt { font-size: 14px; line-height: 1.45; color: #e2e8f0; word-break: break-word; white-space: pre-wrap; }
  .zero-copy-hint {
    background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.45);
    color: #a7f3d0; border-radius: 12px; padding: 11px 13px; font-size: 13px;
    line-height: 1.5; margin-bottom: 10px; font-weight: 600;
  }
  .slides-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .slide-thumb-wrap { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-align: center; }
  .slide-thumb-wrap img { width: 100%; aspect-ratio: 3/4; object-fit: contain; background: #090d16; display: block; }
  .slide-cap { font-size: 11px; color: var(--muted); padding: 4px 0; }
  .help-tip { font-size: 12px; color: var(--muted); line-height: 1.5; background: rgba(255,255,255,0.04); padding: 9px 11px; border-radius: 10px; margin-top: 6px; }
  .acct-input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #334155;
    background: #0f172a; color: #f8fafc; font-size: 16px; font-weight: 700;
    margin: 12px 0; outline: none;
  }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #10b981; color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    display: none; z-index: 999; white-space: nowrap;
  }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">📱 矩阵手机 · 永久领料台</div>
    <div class="hdr-sub" id="connSub">正在连接电脑总控台...</div>
  </div>
  <div class="hdr-right">
    <button class="btn-refresh" onclick="boot()">🔄 刷新</button>
    <div class="badge-acct" id="badgeAcct">--</div>
  </div>
</div>

<div id="app">
  <div class="card"><div class="prod-name">⚡ 正在同步电脑最新派单队列...</div></div>
</div>
<div id="toast" class="toast"></div>

<script>
const GIST_ID = "c21cd7cb2d9b00fd8756b6542d97bcb8";
let ACCT = "";
let BASE_TUNNEL = "";
let OVERRIDE_TUNNEL = "";
let SECRET = "";
let LAST_SERVER_TIME = "";
let ITEMS = [];
const preloadedFiles = {};
const preloadPromises = {};
let preloadObserver = null;
let preloadQueue = [];
const preloadQueuedKeys = new Set();
let activePreloads = 0;
const MAX_PRELOAD_CONC = 2;

function itemVariant(it) {
  return (it && it.variant_id) ? it.variant_id : "v1";
}
function itemKey(it) {
  return `${it.pid}:${itemVariant(it)}`;
}
function domIdOfKey(key) {
  return String(key || "").replace(/[^a-zA-Z0-9_-]/g, "_");
}
function getItemByKey(key) {
  return ITEMS.find(x => itemKey(x) === key);
}
function escJs(str) {
  return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}
function clearObjectProps(obj) {
  Object.keys(obj).forEach(k => delete obj[k]);
}
function updateConnSub() {
  const sub = document.getElementById("connSub");
  if (!sub) return;
  const pending = ITEMS.filter(x => !x.published).length;
  sub.textContent = `🟢 已连上电脑总控台 · 待领 ${pending} 套${LAST_SERVER_TIME ? ` (${LAST_SERVER_TIME})` : ''}`;
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function sanitizeAcct(raw) {
  return String(raw || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20);
}

function resolveIdentity() {
  const sp = new URLSearchParams(location.search);
  OVERRIDE_TUNNEL = (sp.get("tunnel") || "").trim().replace(/\/+$/, "");
  const rawHash = (location.hash || "").replace(/^#/, "").trim();
  let hashAcct = "";
  let hashTok = rawHash;
  const colonIdx = rawHash.indexOf(":");
  if (colonIdx > 0) {
    hashAcct = sanitizeAcct(rawHash.slice(0, colonIdx));
    hashTok = rawHash.slice(colonIdx + 1).trim();
  }

  let acct = sanitizeAcct(sp.get("acct")) || hashAcct;
  try {
    if (!acct) acct = sanitizeAcct(localStorage.getItem("tk_pick_last_acct"));
  } catch (e) {}

  let tok = hashTok || (sp.get("k") || "").trim();
  try {
    if (!tok && acct) tok = (localStorage.getItem("tk_pick_k_" + acct) || "").trim();
    if (!tok) tok = (localStorage.getItem("tk_pick_k") || "").trim();
    if (acct) localStorage.setItem("tk_pick_last_acct", acct);
    if (tok) {
      if (acct) localStorage.setItem("tk_pick_k_" + acct, tok);
      localStorage.setItem("tk_pick_k", tok);
    }
  } catch (e) {}

  if (acct && tok) {
    try {
      const targetUrl = `?acct=${encodeURIComponent(acct)}#${tok}`;
      if (location.search !== `?acct=${encodeURIComponent(acct)}` || location.hash !== `#${tok}`) {
        history.replaceState(null, "", targetUrl);
      }
    } catch (e) {}
  }

  ACCT = acct;
  SECRET = tok;
  applyBranding();
}

function applyBranding() {
  const label = ACCT ? `${ACCT}号机` : "矩阵手机";
  document.title = `📱 ${label} · 专属无损领料台`;
  const metaTitle = document.getElementById("metaAppTitle");
  if (metaTitle) metaTitle.setAttribute("content", ACCT ? `${ACCT}领料台` : "矩阵领料台");
  const hdrTitle = document.getElementById("hdrTitle");
  if (hdrTitle) hdrTitle.textContent = `📱 ${label} · 永久领料台`;
  const badgeAcct = document.getElementById("badgeAcct");
  if (badgeAcct) badgeAcct.textContent = ACCT || "--";
}

function bindManualAcct() {
  const inp = document.getElementById("manualAcctInput");
  const clean = sanitizeAcct(inp ? inp.value : "");
  if (!clean) {
    showToast("⚠️ 请输入有效的手机编号（字母/数字）", "#f59e0b");
    return;
  }
  ACCT = clean;
  try {
    localStorage.setItem("tk_pick_last_acct", ACCT);
    if (SECRET) {
      localStorage.setItem("tk_pick_k_" + ACCT, SECRET);
      localStorage.setItem("tk_pick_k", SECRET);
      history.replaceState(null, "", `?acct=${encodeURIComponent(ACCT)}#${SECRET}`);
    } else {
      history.replaceState(null, "", `?acct=${encodeURIComponent(ACCT)}`);
    }
  } catch (e) {}
  applyBranding();
  boot();
}

function showToast(msg, bg="#10b981") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = bg;
  t.style.display = "block";
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => { t.style.display = "none"; }, 2400);
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      showToast("✅ 已复制 " + label + "！去 TikTok 粘贴");
      return;
    }
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); showToast("✅ 已复制 " + label + "！"); }
  catch (e) { showToast("⚠️ 请长按文本手动复制", "#f59e0b"); }
  document.body.removeChild(ta);
}

function copyItemField(key, field, label) {
  const item = getItemByKey(key);
  if (!item) return;
  copyText(item[field] || "", label);
}

function preloadItemSlides(item) {
  if (!item) return Promise.resolve([]);
  const key = itemKey(item);
  if (preloadedFiles[key] && preloadedFiles[key].length) {
    return Promise.resolve(preloadedFiles[key]);
  }
  if (preloadPromises[key]) {
    return preloadPromises[key];
  }
  const domId = domIdOfKey(key);
  const p = (async () => {
    const statusEl = document.getElementById(`preload-status-${domId}`);
    const saveBtn = document.getElementById(`save-btn-${domId}`);
    const files = [];
    try {
      for (let i = 0; i < item.slide_names.length; i++) {
        const sname = item.slide_names[i];
        if (statusEl) {
          statusEl.textContent = `⚡ 正在预加载无损原图 (${i+1}/${item.slide_names.length})...`;
        }
        const url = `${BASE_TUNNEL}/raw/${encodeURIComponent(item.pid)}/${encodeURIComponent(itemVariant(item))}/${encodeURIComponent(sname)}?k=${encodeURIComponent(SECRET)}&t=${Date.now()}`;
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const blob = await resp.blob();
        files.push(new File([blob], `${item.pid}_${itemVariant(item)}_${String(i+1).padStart(2,"0")}.jpg`, { type: "image/jpeg" }));
      }
      if (!getItemByKey(key)) return [];
      preloadedFiles[key] = files;
      const curStatusEl = document.getElementById(`preload-status-${domId}`);
      const curSaveBtn = document.getElementById(`save-btn-${domId}`);
      if (curStatusEl) curStatusEl.textContent = `✅ ${files.length} 张无损高清原图已就绪`;
      if (curSaveBtn) curSaveBtn.innerHTML = `📥 一键存全套 ${files.length} 张图到系统相册`;
      return files;
    } catch (err) {
      const curStatusEl = document.getElementById(`preload-status-${domId}`);
      const curSaveBtn = document.getElementById(`save-btn-${domId}`);
      if (curStatusEl) curStatusEl.textContent = `⚠️ 预加载中断 (${err.message})，可点下方重试或长按单图保存`;
      if (curSaveBtn) curSaveBtn.innerHTML = `🔄 点击重试加载整套原图`;
      return [];
    } finally {
      delete preloadPromises[key];
    }
  })();
  preloadPromises[key] = p;
  return p;
}

function schedulePreload(key) {
  if (!key || preloadedFiles[key] || preloadQueuedKeys.has(key)) return;
  if (!getItemByKey(key)) return;
  preloadQueuedKeys.add(key);
  preloadQueue.push(key);
  drainPreloadQueue();
}

function drainPreloadQueue() {
  while (activePreloads < MAX_PRELOAD_CONC && preloadQueue.length > 0) {
    const nextKey = preloadQueue.shift();
    preloadQueuedKeys.delete(nextKey);
    const item = getItemByKey(nextKey);
    if (!item || preloadedFiles[nextKey]) continue;
    activePreloads++;
    preloadItemSlides(item).finally(() => {
      activePreloads = Math.max(0, activePreloads - 1);
      drainPreloadQueue();
    });
  }
}

async function saveAllSlides(key) {
  const item = getItemByKey(key);
  if (!item) return;
  const files = preloadedFiles[key];
  if (files && files.length) {
    if (navigator.canShare && navigator.canShare({ files })) {
      try {
        await navigator.share({ files });
        showToast("🎉 在弹出菜单点「存储 " + files.length + " 张图像」即全进相册！");
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    showToast("💡 请长按下方 P1~P" + files.length + " 缩略图逐张存相册", "#f59e0b");
    return;
  }
  const loaded = await preloadItemSlides(item);
  if (loaded && loaded.length) {
    showToast("✅ 原图已就绪，请再点一次保存", "#10b981");
  }
}

async function reportAction(key, action) {
  const item = getItemByKey(key);
  if (!item) return;
  try {
    const resp = await fetch(`${BASE_TUNNEL}/api/mark?k=${encodeURIComponent(SECRET)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account_key: ACCT, pid: item.pid, variant_id: item.variant_id, action })
    });
    const res = await resp.json();
    if (res.ok) {
      const domId = domIdOfKey(key);
      const cardEl = document.getElementById(`card-${domId}`);
      if (action === "dismiss") {
        showToast("🗑️ 已移出待领队列");
        if (preloadObserver && cardEl) {
          try { preloadObserver.unobserve(cardEl); } catch (e) {}
        }
        preloadQueue = preloadQueue.filter(k => k !== key);
        preloadQueuedKeys.delete(key);
        delete preloadedFiles[key];
        delete preloadPromises[key];
        ITEMS = ITEMS.filter(x => itemKey(x) !== key);
        if (cardEl) cardEl.remove();
        updateConnSub();
        if (!ITEMS.length) renderItems();
      } else if (action === "publish") {
        item.published = true;
        delete preloadedFiles[key];
        delete preloadPromises[key];
        if (cardEl) {
          cardEl.classList.add("is-done");
          const pubBtn = cardEl.querySelector('[data-pub-btn="1"]');
          if (pubBtn) pubBtn.textContent = "✅ 已登记发帖（电脑总控台已同步）";
          const metaEl = cardEl.querySelector(".prod-meta");
          if (metaEl && !metaEl.querySelector('[data-pub-tag="1"]')) {
            const tag = document.createElement("span");
            tag.className = "tag tag-green";
            tag.setAttribute("data-pub-tag", "1");
            tag.textContent = "✅ 本号已登记发帖";
            metaEl.appendChild(tag);
          }
        }
        let addedRefill = 0;
        if (Array.isArray(res.refilled_items) && res.refilled_items.length > 0) {
          addedRefill = appendRefilledItems(res.refilled_items);
        }
        updateConnSub();
        if (addedRefill > 0) {
          showToast(`✅ 已登记发帖！已从中央池自动补货 +${addedRefill} 套`);
        } else {
          showToast("✅ 已同步回电脑总控台！");
        }
      } else {
        showToast("✅ 已记录加橱窗！");
      }
    }
  } catch (e) {
    showToast("⚠️ 网络波动，稍后再试", "#ef4444");
  }
}

function renderCardHtml(it) {
  const key = itemKey(it);
  const keyJs = esc(escJs(key));
  const domId = domIdOfKey(key);
  const isPreloaded = !!(preloadedFiles[key] && preloadedFiles[key].length);
  const fallbackUrl = (it.tsp && it.tsp.share_url) ? it.tsp.share_url : (`${BASE_TUNNEL}/go_showcase/${encodeURIComponent(it.pid)}`);
  const isRealTsp = !!(it.tsp && it.tsp.share_url && it.tsp.is_tsp !== false);
  const tspBtn = isRealTsp
    ? `<a class="btn btn-amber" href="${esc(it.tsp.share_url)}" target="_blank" onclick="reportAction('${keyJs}', 'cart')">
         💎 未挂车点此：直跳 TSP 高佣加橱窗 (${esc(it.tsp.partner_commission)}%+${esc(it.tsp.creator_commission)}%)
       </a>`
    : `<a class="btn btn-amber" href="${esc(fallbackUrl)}" target="_blank" onclick="reportAction('${keyJs}', 'cart')">
         🛒 未挂车点此：直跳 TikTok 达人加橱窗 (非TSP公开计划)
       </a>`;
  const thumbs = it.slide_names.map((sn, sIdx) => {
    const rawUrl = `${BASE_TUNNEL}/raw/${encodeURIComponent(it.pid)}/${encodeURIComponent(itemVariant(it))}/${encodeURIComponent(sn)}?k=${encodeURIComponent(SECRET)}`;
    return `<div class="slide-thumb-wrap">
      <img src="${rawUrl}" loading="lazy" alt="P${sIdx+1}">
      <div class="slide-cap">P${sIdx+1} (${it.slide_sizes_kb[sIdx]}KB)</div>
    </div>`;
  }).join("");

  const hasTitle = !!(it.title || "").trim();
  const hasCaption = !!(it.caption || "").trim();
  const copySection = (!hasTitle && !hasCaption)
    ? `<div class="step-label">📋 第二步：发布文案说明</div>
       <div class="zero-copy-hint">✨ 本套为「零文案直发模式」：Title 与 Caption 直接留空不填（避免黑底文字遮挡底部红圈价格）</div>`
    : `<div class="step-label">📋 第二步：复制标题与正文</div>
       <div class="copy-box">
         <div class="copy-hdr">📌 Title（标题）</div>
         <div class="copy-txt">${esc(it.title || '(无标题)')}</div>
       </div>
       <button class="btn btn-blue" onclick="copyItemField('${keyJs}', 'title', 'Title 标题')">📋 一键复制 Title 标题</button>
       <div class="copy-box">
         <div class="copy-hdr">📝 Caption（正文 + 标签）</div>
         <div class="copy-txt">${esc(it.caption || '(零正文)')}</div>
       </div>
       <button class="btn btn-slate" onclick="copyItemField('${keyJs}', 'caption', 'Caption 正文')">📋 一键复制 Caption 正文</button>`;

  return `<div class="card ${it.published ? 'is-done' : ''}" id="card-${esc(domId)}" data-item-key="${esc(key)}">
    <div class="prod-top">
      <div class="prod-name">${esc(it.cn_name)}</div>
      <button class="btn-del" onclick="reportAction('${keyJs}', 'dismiss')">移出列表 ×</button>
    </div>
    <div class="prod-meta">
      <span class="tag">PID: ${esc(it.pid)}</span>
      <span class="tag tag-green">${esc(itemVariant(it).toUpperCase())} (${it.slide_names.length}张)</span>
      ${it.queued_at ? `<span class="tag">派单 ${esc(it.queued_at)}</span>` : ''}
      ${it.published ? `<span class="tag tag-green" data-pub-tag="1">✅ 本号已登记发帖</span>` : ''}
    </div>

    ${tspBtn ? `<div class="step-label">🛒 橱窗挂车（若尚未加橱窗）</div>${tspBtn}` : ''}

    <div class="step-label">📸 第一步：存无损原图进系统相册</div>
    <div class="preload-bar" id="preload-status-${esc(domId)}">${isPreloaded ? `✅ ${it.slide_names.length} 张无损高清原图已就绪` : '💤 滑动到此自动预加载，或直接点下方按钮'}</div>
    <button id="save-btn-${esc(domId)}" class="btn btn-primary" onclick="saveAllSlides('${keyJs}')">📥 一键存全套 ${it.slide_names.length} 张图到系统相册</button>
    <div class="help-tip">点上方红按钮 → 弹出菜单点 <b>「存储 ${it.slide_names.length} 张图像」</b> 按顺序一次全进相册（也可长按下方单图存）</div>
    <div class="slides-strip">${thumbs}</div>

    ${copySection}

    <div class="help-tip" style="margin-bottom:12px;">🎵 <b>防静音铁律</b>：进 TikTok 选好图后，<b>先挂橙色小黄车，最后再去顶部搜商用音乐</b>。</div>

    <button class="btn btn-green" data-pub-btn="1" onclick="reportAction('${keyJs}', 'publish')">
      ${it.published ? '✅ 已登记发帖（电脑总控台已同步）' : '✅ 我已在手机发完帖（同步回电脑工作台）'}
    </button>
  </div>`;
}

function ensurePreloadObserver() {
  if (!preloadObserver && ("IntersectionObserver" in window)) {
    preloadObserver = new IntersectionObserver((entries, obs) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const k = entry.target.getAttribute("data-item-key");
          obs.unobserve(entry.target);
          if (k) schedulePreload(k);
        }
      }
    }, { rootMargin: "260px 0px" });
  }
  return preloadObserver;
}

function appendRefilledItems(newItems) {
  if (!Array.isArray(newItems) || !newItems.length) return 0;
  const existingKeys = new Set(ITEMS.map(itemKey));
  const fresh = newItems.filter(it => it && !existingKeys.has(itemKey(it)));
  if (!fresh.length) return 0;

  if (!ITEMS.length) {
    ITEMS = fresh;
    updateConnSub();
    renderItems();
    return fresh.length;
  }

  const pendingBefore = ITEMS.filter(x => !x.published).length;
  ITEMS = ITEMS.concat(fresh);
  const root = document.getElementById("app");
  if (root) {
    root.insertAdjacentHTML("beforeend", fresh.map(renderCardHtml).join(""));
    const obs = ensurePreloadObserver();
    let immediateNeed = Math.max(0, 2 - pendingBefore);
    for (const it of fresh) {
      const k = itemKey(it);
      if (immediateNeed > 0 && !it.published) {
        immediateNeed--;
        schedulePreload(k);
        continue;
      }
      const el = document.getElementById(`card-${domIdOfKey(k)}`);
      if (el && obs) obs.observe(el);
      else if (!obs && !it.published) schedulePreload(k);
    }
  }
  updateConnSub();
  return fresh.length;
}

function renderItems() {
  if (preloadObserver) {
    preloadObserver.disconnect();
    preloadObserver = null;
  }
  preloadQueue = [];
  preloadQueuedKeys.clear();

  const root = document.getElementById("app");
  if (!ITEMS.length) {
    root.innerHTML = `<div class="card">
      <div class="prod-name">🎉 当前 ${esc(ACCT)} 号机暂无待领套图</div>
      <div class="help-tip" style="margin-top:10px;">在电脑 <code>8788</code> 总控台任意商品行点击 <b>「派单 / 改词」</b> 选 <b>${esc(ACCT)}</b> 并点「秒派手机云领料台」，再点右上角「🔄 刷新」即可秒领！</div>
    </div>`;
    return;
  }
  root.innerHTML = ITEMS.map(renderCardHtml).join("");

  const initKeys = new Set();
  for (let i = 0; i < ITEMS.length; i++) {
    if (!ITEMS[i].published && initKeys.size < 2) {
      const k = itemKey(ITEMS[i]);
      initKeys.add(k);
      schedulePreload(k);
    }
  }

  const remainingCards = Array.from(root.querySelectorAll(".card[data-item-key]")).filter((el) => {
    const k = el.getAttribute("data-item-key");
    return k && !initKeys.has(k);
  });

  if (remainingCards.length) {
    const obs = ensurePreloadObserver();
    if (obs) {
      for (const el of remainingCards) {
        obs.observe(el);
      }
    } else {
      for (const el of remainingCards) {
        const k = el.getAttribute("data-item-key");
        const it = k ? getItemByKey(k) : null;
        if (it && !it.published) schedulePreload(k);
      }
    }
  }
}

async function resolveTunnelUrl() {
  const sp = new URLSearchParams(location.search);
  const overrideUrl = OVERRIDE_TUNNEL || (sp.get("tunnel") || "").trim().replace(/\/+$/, "");
  if (overrideUrl) return overrideUrl;
  if (!location.hostname.endsWith("github.io") && location.protocol.startsWith("http")) {
    return location.origin.replace(/\/+$/, "");
  }

  let lastErr = "Gist lookup failed";
  try {
    const gResp = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`, { cache: "no-store" });
    if (gResp.ok) {
      const gData = await gResp.json();
      const parsed = JSON.parse(gData.files["pickup_tunnel.json"].content);
      const url = (parsed.tunnel_url || "").replace(/\/+$/, "");
      if (url) return url;
    } else {
      lastErr = "Gist HTTP " + gResp.status;
    }
  } catch (e) {
    lastErr = e.message || String(e);
  }

  // Fallback to raw gist URL to bypass GitHub REST API 403 rate limits on shared IPs
  const rawResp = await fetch(`https://gist.githubusercontent.com/yueyingkey099-hub/${GIST_ID}/raw/pickup_tunnel.json?t=${Date.now()}`, { cache: "no-store" });
  if (!rawResp.ok) throw new Error(`${lastErr} / Raw HTTP ${rawResp.status}`);
  const rawParsed = await rawResp.json();
  const rawUrl = (rawParsed.tunnel_url || "").replace(/\/+$/, "");
  if (!rawUrl) throw new Error("电脑隧道未启动");
  return rawUrl;
}

async function boot() {
  resolveIdentity();
  const sub = document.getElementById("connSub");
  const root = document.getElementById("app");
  if (!ACCT) {
    sub.textContent = "等待绑定手机编号";
    root.innerHTML = `<div class="card">
      <div class="prod-name">📱 首次打开：请输入本台手机编号</div>
      <div class="help-tip" style="margin-top:8px;">输入后将自动保存并绑定到本机浏览器（如 <code>53</code>、<code>36</code>、<code>A01</code>）。</div>
      <input id="manualAcctInput" class="acct-input" placeholder="输入手机编号，例如 53" autocomplete="off" />
      <button class="btn btn-primary" onclick="bindManualAcct()">✅ 确认绑定并加载待领套图</button>
    </div>`;
    return;
  }
  if (!SECRET) {
    sub.textContent = "缺少绑定密钥";
    root.innerHTML = `<div class="card"><div class="prod-name">🔒 请用手机相机扫一次电脑「全矩阵永久远程领料码」面板生成的专属二维码（扫一次永久生效）</div></div>`;
    return;
  }
  try {
    sub.textContent = "正在定位电脑安全隧道...";
    BASE_TUNNEL = await resolveTunnelUrl();
    if (!BASE_TUNNEL) throw new Error("电脑隧道未启动");

    const qResp = await fetch(`${BASE_TUNNEL}/api/queue/${encodeURIComponent(ACCT)}?k=${encodeURIComponent(SECRET)}&t=${Date.now()}`, { cache: "no-store" });
    if (!qResp.ok) throw new Error("电脑服务未响应 (" + qResp.status + ")");
    const qData = await qResp.json();
    if (preloadObserver) {
      preloadObserver.disconnect();
      preloadObserver = null;
    }
    preloadQueue = [];
    preloadQueuedKeys.clear();
    activePreloads = 0;
    clearObjectProps(preloadedFiles);
    clearObjectProps(preloadPromises);
    LAST_SERVER_TIME = qData.server_time || "";
    ITEMS = qData.items || [];
    updateConnSub();
    renderItems();
    if (Number(qData.refilled_count || 0) > 0) {
      showToast(`⚡ 队列不足，已自动补货 +${qData.refilled_count} 套！`);
    }
  } catch (err) {
    sub.textContent = "🔴 电脑总控台未在线";
    root.innerHTML = `<div class="card">
      <div class="prod-name">⚠️ 暂未连上电脑领料服务</div>
      <div class="help-tip" style="margin-top:8px;">请确认电脑已打开 <code>start_workbench.bat</code>，然后点右上角「🔄 刷新」。(${esc(err.message)})</div>
    </div>`;
  }
}

boot();
</script>
