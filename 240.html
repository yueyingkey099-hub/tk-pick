<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="240领料台">
<title>📱 240号机 · 专属领料台</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:#0b1120; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,sans-serif; text-align:center; padding:24px; }
  .spin { width:38px; height:38px; border:4px solid #1e293b; border-top-color:#fe2c55; border-radius:50%;
          animation:sp 0.75s linear infinite; margin-bottom:16px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .msg { font-size:16px; font-weight:700; margin-bottom:6px; }
  .sub { font-size:13px; color:#94a3b8; line-height:1.5; }
  .btn { margin-top:18px; padding:12px 22px; background:#2563eb; color:#fff; border:none; border-radius:12px;
         font-size:15px; font-weight:700; display:none; cursor:pointer; }
</style>
</head>
<body>
  <div class="spin" id="sp"></div>
  <div class="msg" id="msg">⚡ 正在连接 240 号机专属领料台...</div>
  <div class="sub" id="sub">建议先把本页存为 Safari 标签页或添加到主屏幕（永久固定地址）</div>
  <button class="btn" id="retryBtn" onclick="go()">🔄 重新连接</button>
<script>
const PHONE = "240";
const GIST_ID = "c21cd7cb2d9b00fd8756b6542d97bcb8";

// Persist token in localStorage on this iPhone so even if Safari strips #hash on bookmarking, it STILL works forever!
function getSecret() {
  const h = (location.hash || "").replace(/^#/, "").trim();
  const q = new URLSearchParams(location.search).get("k") || "";
  const tok = h || q || localStorage.getItem("tk_pick_k") || "";
  if (tok) {
    try { localStorage.setItem("tk_pick_k", tok); } catch(e) {}
  }
  return tok;
}

async function go() {
  const k = getSecret();
  const msgEl = document.getElementById("msg");
  const subEl = document.getElementById("sub");
  const btn = document.getElementById("retryBtn");
  const sp = document.getElementById("sp");
  btn.style.display = "none";
  sp.style.display = "block";
  if (!k) {
    sp.style.display = "none";
    msgEl.textContent = "🔒 首次绑定缺少密钥";
    subEl.textContent = "请用 iPhone 相机重新扫一次电脑总控台的永久绑定码";
    return;
  }
  try {
    const r = await fetch("https://api.github.com/gists/" + GIST_ID + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("Gist HTTP " + r.status);
    const data = await r.json();
    const content = data.files["pickup_tunnel.json"].content;
    const parsed = JSON.parse(content);
    const base = (parsed.tunnel_url || "").replace(/\/+$/, "");
    if (!base) throw new Error("电脑端隧道尚未启动");
    const target = base + "/p/" + encodeURIComponent(PHONE) + "?k=" + encodeURIComponent(k) + "&entry=" + encodeURIComponent(location.href.split("#")[0]);
    location.replace(target);
  } catch (err) {
    sp.style.display = "none";
    msgEl.textContent = "⚠️ 电脑总控台隧道暂未在线";
    subEl.textContent = "请确认电脑已打开 start_workbench.bat (" + err.message + ")";
    btn.style.display = "inline-block";
  }
}
go();
</script>
</body>
</html>
